services:
  postgres:
    image: postgres:16-alpine
    container_name: jalpilot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-jalpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jalpilot_secret}
      POSTGRES_DB: ${DB_NAME:-jalpilot_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jalpilot} -d ${DB_NAME:-jalpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jalpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: jalpilot-api
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: jalpilot-worker
    command: ["/app/jalpilot-worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

