openapi: 3.1.0
info:
  title: JalPilot API
  version: 1.0.0
  description: Multi-Tenant Water Supply Management SaaS REST API
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Register a new water supply company workspace
      tags: [Auth]
      responses:
        "201":
          description: Company workspace created
  /auth/login:
    post:
      summary: Authenticate user and issue HTTP-only JWT & refresh cookies
      tags: [Auth]
      responses:
        "200":
          description: Login successful
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      tags: [Auth]
      responses:
        "200":
          description: Token refreshed
  /auth/logout:
    post:
      summary: Revoke session and clear auth cookies
      tags: [Auth]
      responses:
        "200":
          description: Logged out

